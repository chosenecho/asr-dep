# Production Nginx reverse proxy for Qwen3-ASR long-audio API

limit_req_zone $binary_remote_addr zone=asr_api_limit:10m rate=10r/s;

upstream qwen3_asr_backend {
    server qwen3-asr-api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Support large long-audio uploads (match MAX_UPLOAD_SIZE_MB in .env)
    client_max_body_size 512M;
    client_body_timeout 600s;

    # Stream upload directly to FastAPI instead of double-buffering on Nginx disk
    proxy_request_buffering off;

    location /health {
        proxy_pass http://qwen3_asr_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        limit_req zone=asr_api_limit burst=20 nodelay;

        proxy_pass http://qwen3_asr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Generous timeouts for synchronous medium-length audio requests
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}

