services:
  qwen3-asr-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: qwen3-asr-api:latest
    container_name: qwen3-asr-api
    restart: unless-stopped
    # Allow API cleanup and GPU reader reclamation before Docker sends SIGKILL.
    stop_grace_period: 90s
    env_file:
      - .env
    environment:
      - ASR_MODEL_PATH=/models/Qwen3-ASR-1.7B
      - ALIGNER_MODEL_PATH=/models/Qwen3-ForcedAligner-0.6B
      - DATA_DIR=/app/data
      - GPU_IDS=${GPU_IDS:-0,1}
    ports:
      # Keep the backend local; the optional Nginx is the public entry point.
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - ./models:/models:ro
      - ./data:/app/data
    ipc: host
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Expose installed GPUs; GPU_IDS chooses the per-card workers.
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Optional Nginx reverse proxy (enable with: docker compose --profile proxy up -d)
  nginx:
    image: nginx:1.27-alpine
    container_name: qwen3-asr-nginx
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      qwen3-asr-api:
        condition: service_healthy
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./deploy/certs:/etc/nginx/certs:ro
